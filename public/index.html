.badge { font-size: .65rem; padding: .15rem .45rem; border-radius: 999px; }

const API_URL = SCRIPT_URL;

const DEMO_KEY = 'pcr_demo_db_v1';
</script>

<script>

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

let state = {
  user: null, tab: 'home', demo: false, backendVersion: null,
  usersCache: [], usersError: null, usersLoading: false
};

/* Fiji time UTC+12 — never use device local for cutoffs/dates */
const FIJI_OFFSET_MS = 12 * 60 * 60 * 1000;
function getFijiNow() { return new Date(Date.now() + FIJI_OFFSET_MS); }
function pad2(n){ return String(n).padStart(2,'0'); }
function fijiDateString(d=getFijiNow()) {
  return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());
}
function formatFiji(d=getFijiNow()) {
  return fijiDateString(d)+' '+pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes())+' FJT';
}
function addFijiDays(d, days) { return new Date(d.getTime() + days * 86400000); }
/** Dinner: closes 8pm Fiji today for tomorrow service */
function dinnerCutoffInfo(now=getFijiNow()) {
  return { open: now.getUTCHours() < 20, serviceDate: fijiDateString(addFijiDays(now,1)),
    cutoffLabel: '8:00 PM Fiji (today for tomorrow dinner)', meal:'dinner', fijiNow: formatFiji(now) };
}
/** Lunch/Duty: closes 10am Fiji same day */
function lunchCutoffInfo(now=getFijiNow()) {
  return { open: now.getUTCHours() < 10, serviceDate: fijiDateString(now),
    cutoffLabel: '10:00 AM Fiji (same day)', meal:'lunch', fijiNow: formatFiji(now) };
}

function defaultDemoDb() {
  return {
    users: [
      { id:'usr_super', email:'it@paradisecoveresortfiji.com', password:'21slands', firstName:'IT', lastName:'Admin', department:'IT', contact:'9999999', role:'super_admin', roster:'Mon-Fri', village:'Malolo', active:true, verified:true },
      { id:'usr_hod', email:'hod.fb@pcr.com', password:'staff123', firstName:'Sera', lastName:'Nabua', department:'F&B', contact:'8888888', role:'hod', roster:'Roster A', village:'Nadi', active:false, verified:false },
      { id:'usr_kit', email:'kitchen@paradisecoveresortfiji.com', password:'staff123', firstName:'Cesare', lastName:'Chef', department:'Kitchen', contact:'7777777', role:'kitchen', roster:'AM', village:'Resort', active:true, verified:true },
      { id:'usr_st1', email:'ana.tui@paradisecoveresortfiji.com', password:'staff123', firstName:'Ana', lastName:'Tui', department:'Housekeeping', contact:'6666666', role:'staff', roster:'Roster B', village:'Navini', active:true, verified:true },
      { id:'usr_boat', email:'boat@paradisecoveresortfiji.com', password:'staff123', firstName:'Jone', lastName:'Waqa', department:'Boat', contact:'5555555', role:'boat', roster:'Daily', village:'Resort', active:true, verified:true }
    ],
    boatRuns: [
      { id:'run1', date: fijiDateString(), time:'07:00', route:'Denarau → Resort', capacity:24, notes:'Morning', active:true },
      { id:'run2', date: fijiDateString(), time:'16:30', route:'Resort → Denarau', capacity:24, notes:'Afternoon', active:true },
      { id:'run3', date: fijiDateString(addFijiDays(getFijiNow(),1)), time:'07:00', route:'Denarau → Resort', capacity:20, notes:'', active:true }
    ],
    boatBookings: [], dinnerOrders: [], lunchOrders: [], reminders: [],
    suggestions: [{ id:'sug1', userEmail:'ana.tui@paradisecoveresortfiji.com', userName:'Ana Tui', title:'More shade at jetty', body:'Umbrellas for afternoon boats', votes:3, voters:'a,b,c', createdAt:formatFiji(), status:'open' }],
    leaveRequests: [],
    alertEmails: [
      'leanne@paradisecoveresortfiji.com','agm@paradisecoveresortfiji.com','cesare@paradisecoveresortfiji.com',
      'wood.nicolas@gmail.com','pranav619kumar@gmail.com'
    ].map((email,i)=>({ email, label:'Default '+(i+1), active:true })),
    verificationCodes: []
  };
}
function loadDemo() {
  try { const raw = localStorage.getItem(DEMO_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  const db = defaultDemoDb(); saveDemo(db); return db;
}
function saveDemo(db){ localStorage.setItem(DEMO_KEY, JSON.stringify(db)); }
function uid(p){ return p + '_' + Math.random().toString(36).slice(2,10); }
function publicUser(u){
  if(!u) return null;
  return { id:u.id, email:u.email, firstName:u.firstName||'', lastName:u.lastName||'',
    department:u.department||'', contact:u.contact||'', role:u.role||'staff',
    roster:u.roster||'', village:u.village||'', active:!!u.active, verified:!!u.verified,
    needsProfile: !(u.firstName && u.lastName && u.department) };
}
function isDemoMode(){
  const params = new URLSearchParams(location.search);
  return !API_URL || !API_URL.trim() || params.get('demo') === '1';
}

async function api(action, payload={}) {
  if (state.demo) return demoApi(action, payload);
  const body = { action, ...payload };
  if (state.user) {
    body.requesterEmail = state.user.email;
    body.userEmail = body.userEmail || state.user.email;
  }
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow'
  });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch(e) {
    throw new Error('Non-JSON response from API. Check SCRIPT_URL and redeploy Apps Script as Web App (Execute as: Me, Anyone).');
  }
}

function demoApi(action, p) {
  const db = loadDemo();
  const ok = (data) => ({ success:true, data });
  const fail = (error) => ({ success:false, error });
  switch(action) {
    case 'getVersion': case 'health':
      return Promise.resolve({ success:true, ok:true, version: APP_VERSION+'-demo', sheetId:'DEMO', fijiNow: formatFiji() });
    case 'login': {
      const email = String(p.email||'').toLowerCase().trim();
      const u = db.users.find(x => x.email === email);
      if (!u || u.password !== p.password) return Promise.resolve(fail('Invalid email or password'));
      const isPcr = email.includes('@pcr.com');
      const isSuper = email === 'it@paradisecoveresortfiji.com';
      if (!isSuper && isPcr && !u.active) return Promise.resolve(fail('Your account is pending approval. Contact your HOD or IT.'));
      if (!isSuper && !isPcr && !u.verified) return Promise.resolve({ success:false, error:'Email not verified', needsVerification:true, email });
      if (!isSuper && !u.active) return Promise.resolve(fail('Account inactive'));
      return Promise.resolve(ok({ user: publicUser(u), token:'demo' }));
    }
    case 'requestVerification': {
      const code = String(Math.floor(100000+Math.random()*900000));
      db.verificationCodes.push({ email:p.email, code, expiresAt: Date.now()+1.8e6, used:false });
      saveDemo(db);
      return Promise.resolve(ok({ emailed:false, code, message:'Demo: code returned' }));
    }
    case 'verifyEmail': {
      const c = db.verificationCodes.find(x => x.email===p.email && x.code===p.code && !x.used);
      if (!c) return Promise.resolve(fail('Invalid code'));
      c.used = true;
      const u = db.users.find(x => x.email === p.email);
      if (u) { u.verified = true; u.active = true; }
      saveDemo(db);
      return Promise.resolve(ok({ verified:true, user: publicUser(u) }));
    }
    case 'getUsers': {
      let list = db.users.map(publicUser);
      if (p.activeOnly !== false && p.activeOnly !== 'false') list = list.filter(u => u.active);
      if (p.department) list = list.filter(u => u.department === p.department);
      if (p.role) list = list.filter(u => u.role === p.role);
      if (p.search) {
        const q = p.search.toLowerCase();
        list = list.filter(u => (u.email+u.firstName+u.lastName+u.department+u.contact).toLowerCase().includes(q));
      }
      return Promise.resolve(ok({ users:list, total:list.length, version:APP_VERSION+'-demo', fijiNow:formatFiji() }));
    }
    case 'updateProfile': case 'updateUser': {
      const email = (p.targetEmail||p.email||'').toLowerCase();
      const u = db.users.find(x => x.email === email);
      if (!u) return Promise.resolve(fail('User not found'));
      ['firstName','lastName','contact','department','roster','village','role','password'].forEach(k => {
        if (p[k] !== undefined) u[k] = p[k];
      });
      if (p.active !== undefined) u.active = p.active===true || p.active==='true';
      saveDemo(db);
      return Promise.resolve(ok({ user: publicUser(u) }));
    }
    case 'addUser': {
      if (p.passcode !== 'paradise2026') return Promise.resolve(fail('Admin passcode required'));
      const email = String(p.email||'').toLowerCase();
      if (db.users.find(x=>x.email===email)) return Promise.resolve(fail('User already exists'));
      const isPcr = email.includes('@pcr.com');
      const row = {
        id:uid('usr'), email, password:p.password, firstName:p.firstName||'', lastName:p.lastName||'',
        department:p.department||'', contact:p.contact||'', role:p.role||'staff', roster:p.roster||'',
        village:p.village||'', active: p.active!==undefined ? !!p.active : !isPcr, verified: !isPcr
      };
      if (p.active === true || p.active === 'true') row.active = true;
      db.users.push(row); saveDemo(db);
      return Promise.resolve(ok({ user: publicUser(row) }));
    }
    case 'importUsersCSV': {
      if (p.passcode !== 'paradise2026') return Promise.resolve(fail('Admin passcode required'));
      const lines = String(p.csv||'').split(/\r?\n/).filter(l=>l.trim());
      let imported=0, skipped=[];
      lines.forEach((line,idx)=>{
        if (idx===0 && /email/i.test(line)) return;
        const parts = line.split(',').map(s=>s.trim());
        const email = (parts[0]||'').toLowerCase();
        if (!email || !parts[1]) { skipped.push({line:idx+1}); return; }
        if (db.users.find(x=>x.email===email)) { skipped.push({email,reason:'exists'}); return; }
        db.users.push({
          id:uid('usr'), email, password:parts[1], firstName:parts[2]||'', lastName:parts[3]||'',
          department:parts[4]||'', contact:parts[5]||'', role:'staff', roster:'', village:'',
          active:true, verified:true
        });
        imported++;
      });
      saveDemo(db);
      return Promise.resolve(ok({ imported, skipped }));
    }
    case 'getPendingApprovals': {
      const users = db.users.filter(u => u.email.includes('@pcr.com') && !u.active).map(publicUser);
      return Promise.resolve(ok({ users }));
    }
    case 'approveUser': {
      if (p.passcode !== 'paradise2026') return Promise.resolve(fail('passcode'));
      const u = db.users.find(x => x.email === (p.targetEmail||'').toLowerCase());
      if (!u) return Promise.resolve(fail('not found'));
      u.active = true; u.verified = true; saveDemo(db);
      return Promise.resolve(ok({ user: publicUser(u) }));
    }
    case 'getAlertEmails':
      return Promise.resolve(ok({ emails: db.alertEmails }));
    case 'saveAlertEmails': {
      if (p.passcode !== 'paradise2026') return Promise.resolve(fail('passcode'));
      let emails = p.emails;
      if (typeof emails === 'string') emails = emails.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
      db.alertEmails = emails.map((e,i)=>({ email: typeof e==='string'?e:e.email, label:'Alert '+(i+1), active:true }));
      saveDemo(db);
      return Promise.resolve(ok({ emails: db.alertEmails }));
    }

    case 'getBoatRuns':
      return Promise.resolve(ok({ runs: db.boatRuns.filter(r=>r.active!==false) }));
    case 'saveBoatRun': {
      if (p.passcode !== 'paradise2026') return Promise.resolve(fail('passcode'));
      if (p.id) {
        const r = db.boatRuns.find(x=>x.id===p.id);
        Object.assign(r, { date:p.date, time:p.time, route:p.route, capacity:p.capacity, notes:p.notes });
        saveDemo(db); return Promise.resolve(ok({ run:r }));
      }
      const run = { id:uid('run'), date:p.date||fijiDateString(), time:p.time, route:p.route, capacity:p.capacity||20, notes:p.notes||'', active:true };
      db.boatRuns.push(run); saveDemo(db); return Promise.resolve(ok({ run }));
    }
    case 'bookBoat': {
      const run = db.boatRuns.find(r=>r.id===p.runId);
      if (!run) return Promise.resolve(fail('Run not found'));
      const used = db.boatBookings.filter(b=>b.runId===p.runId && b.status!=='cancelled').reduce((s,b)=>s+Number(b.seats||1),0);
      const seats = Number(p.seats||1);
      if (used+seats > Number(run.capacity)) return Promise.resolve(fail('Not enough seats'));
      const u = db.users.find(x=>x.email===(p.userEmail||state.user.email));
      const booking = { id:uid('bb'), runId:p.runId, userEmail:u.email, userName:u.firstName+' '+u.lastName, seats, status:'confirmed', notes:p.notes||'', createdAt:formatFiji() };
      db.boatBookings.push(booking); saveDemo(db); return Promise.resolve(ok({ booking }));
    }
    case 'cancelBoatBooking': {
      const b = db.boatBookings.find(x=>x.id===p.id);
      if (b) b.status='cancelled'; saveDemo(db); return Promise.resolve(ok({ booking:b }));
    }
    case 'myBoatBookings': {
      const email = (p.userEmail||state.user.email).toLowerCase();
      const bookings = db.boatBookings.filter(b=>b.userEmail===email).map(b=>({...b, run: db.boatRuns.find(r=>r.id===b.runId)}));
      return Promise.resolve(ok({ bookings }));
    }
    case 'getBoatBookings':
      return Promise.resolve(ok({ bookings: db.boatBookings.filter(b => !p.runId || b.runId===p.runId) }));
    case 'placeDinnerOrder': {
      const info = dinnerCutoffInfo();
      const late = !info.open;
      if (late && !p.allowLate) return Promise.resolve({ success:false, error:'Dinner closed at 8pm Fiji', cutoff:info });
      const email = (p.userEmail||state.user.email).toLowerCase();
      const u = db.users.find(x=>x.email===email);
      let o = db.dinnerOrders.find(x=>x.userEmail===email && x.serviceDate===(p.serviceDate||info.serviceDate) && x.status!=='cancelled');
      if (o) { o.mealChoice=p.mealChoice; o.notes=p.notes||''; o.late=late; }
      else {
        o = { id:uid('din'), serviceDate:p.serviceDate||info.serviceDate, userEmail:email, userName:u.firstName+' '+u.lastName, department:u.department, mealChoice:p.mealChoice||'Standard', notes:p.notes||'', status:'ordered', late, createdAt:formatFiji() };
        db.dinnerOrders.push(o);
      }
      saveDemo(db); return Promise.resolve(ok({ order:o, late, cutoff:info }));
    }
    case 'placeLunchOrder': {
      const info = lunchCutoffInfo();
      const late = !info.open;
      if (late && !p.allowLate) return Promise.resolve({ success:false, error:'Lunch closed at 10am Fiji', cutoff:info });
      const email = (p.userEmail||state.user.email).toLowerCase();
      const u = db.users.find(x=>x.email===email);
      let o = db.lunchOrders.find(x=>x.userEmail===email && x.serviceDate===(p.serviceDate||info.serviceDate) && x.status!=='cancelled');
      if (o) { o.mealChoice=p.mealChoice; o.notes=p.notes||''; o.late=late; }
      else {
        o = { id:uid('lun'), serviceDate:p.serviceDate||info.serviceDate, userEmail:email, userName:u.firstName+' '+u.lastName, department:u.department, mealChoice:p.mealChoice||'Duty Meal', notes:p.notes||'', status:'ordered', late, createdAt:formatFiji() };
        db.lunchOrders.push(o);
      }
      saveDemo(db); return Promise.resolve(ok({ order:o, late, cutoff:info }));
    }
    case 'getDinnerOrders': {
      let orders = db.dinnerOrders;
      if (p.serviceDate) orders = orders.filter(o=>o.serviceDate===p.serviceDate);
      if (p.userEmail) orders = orders.filter(o=>o.userEmail===p.userEmail);
      return Promise.resolve(ok({ orders, cutoff: dinnerCutoffInfo() }));
    }
    case 'getLunchOrders': {
      let orders = db.lunchOrders;
      if (p.serviceDate) orders = orders.filter(o=>o.serviceDate===p.serviceDate);
      if (p.userEmail) orders = orders.filter(o=>o.userEmail===p.userEmail);
      return Promise.resolve(ok({ orders, cutoff: lunchCutoffInfo() }));
    }
    case 'getKitchenDashboard': {
      const di = dinnerCutoffInfo(), li = lunchCutoffInfo();
      const dinnerDate = p.dinnerDate || di.serviceDate;
      const lunchDate = p.lunchDate || li.serviceDate;
      const dinners = db.dinnerOrders.filter(o=>o.serviceDate===dinnerDate && o.status!=='cancelled');
      const lunches = db.lunchOrders.filter(o=>o.serviceDate===lunchDate && o.status!=='cancelled');
      const tally = (arr) => arr.reduce((m,o)=>{ const k=o.mealChoice||'Standard'; m[k]=(m[k]||0)+1; return m; },{});
      return Promise.resolve(ok({
        dinnerDate, lunchDate,
        dinner:{ orders:dinners, late:dinners.filter(o=>o.late), tally:tally(dinners), cutoff:di },
        lunch:{ orders:lunches, late:lunches.filter(o=>o.late), tally:tally(lunches), cutoff:li },
        fijiNow: formatFiji()
      }));
    }
    case 'markOrderStatus': {
      const list = p.meal==='lunch' ? db.lunchOrders : db.dinnerOrders;
      const o = list.find(x=>x.id===p.id); if(o) o.status=p.status||'prepared';
      saveDemo(db); return Promise.resolve(ok({ order:o }));
    }
    case 'getReminders': {
      const email = (p.userEmail||state.user.email).toLowerCase();
      return Promise.resolve(ok({ reminders: db.reminders.filter(r=>r.userEmail===email) }));
    }
    case 'addReminder': {
      const row = { id:uid('rem'), userEmail:state.user.email, title:p.title, body:p.body||'', dueDate:p.dueDate||'', done:false, createdAt:formatFiji() };
      db.reminders.push(row); saveDemo(db); return Promise.resolve(ok({ reminder:row }));
    }
    case 'completeReminder': {
      const r = db.reminders.find(x=>x.id===p.id); if(r) r.done=true; saveDemo(db); return Promise.resolve(ok({ reminder:r }));
    }
    case 'deleteReminder': {
      db.reminders = db.reminders.filter(x=>x.id!==p.id); saveDemo(db); return Promise.resolve(ok({}));
    }
    case 'getSuggestions':
      return Promise.resolve(ok({ suggestions: [...db.suggestions].sort((a,b)=>b.votes-a.votes) }));
    case 'addSuggestion': {
      const row = { id:uid('sug'), userEmail:state.user.email, userName:state.user.firstName+' '+state.user.lastName, title:p.title, body:p.body||'', votes:0, voters:'', createdAt:formatFiji(), status:'open' };
      db.suggestions.push(row); saveDemo(db); return Promise.resolve(ok({ suggestion:row }));
    }
    case 'voteSuggestion': {
      const s = db.suggestions.find(x=>x.id===p.id);
      if (!s) return Promise.resolve(fail('not found'));
      const voters = (s.voters||'').split(',').filter(Boolean);
      if (voters.includes(state.user.email)) return Promise.resolve(fail('Already voted'));
      voters.push(state.user.email); s.voters=voters.join(','); s.votes=Number(s.votes||0)+1;
      saveDemo(db); return Promise.resolve(ok({ votes:s.votes }));
    }
    case 'getLeaveRequests': {
      let rows = db.leaveRequests;
      if (p.userEmail) rows = rows.filter(r=>r.userEmail===p.userEmail);
      return Promise.resolve(ok({ requests: rows }));
    }
    case 'requestLeave': {
      const row = { id:uid('lv'), userEmail:state.user.email, userName:state.user.firstName+' '+state.user.lastName, department:state.user.department, startDate:p.startDate, endDate:p.endDate, reason:p.reason||'', status:'pending', reviewedBy:'', createdAt:formatFiji() };
      db.leaveRequests.push(row); saveDemo(db); return Promise.resolve(ok({ request:row }));
    }
    case 'reviewLeave': {
      if (p.passcode !== 'paradise2026') return Promise.resolve(fail('passcode'));
      const r = db.leaveRequests.find(x=>x.id===p.id);
      if (r) { r.status = p.status==='approved'?'approved':'rejected'; r.reviewedBy=state.user.email; }
      saveDemo(db); return Promise.resolve(ok({ request:r }));
    }
    case 'getMySchedule': {
      const u = db.users.find(x=>x.email===state.user.email);
      return Promise.resolve(ok({ user:publicUser(u), roster:u && u.roster || '', leave: db.leaveRequests.filter(r=>r.userEmail===state.user.email), fijiNow:formatFiji() }));
    }
    case 'getCutoffInfo':
      return Promise.resolve(ok({ fijiNow:formatFiji(), dinner:dinnerCutoffInfo(), lunch:lunchCutoffInfo() }));
    case 'deleteUser': {
      if (p.passcode !== 'paradise2026') return Promise.resolve(fail('passcode'));
      db.users = db.users.filter(u => u.email !== (p.targetEmail||'').toLowerCase());
      saveDemo(db); return Promise.resolve(ok({ deleted: p.targetEmail }));
    }
    default:
      return Promise.resolve(fail('Unknown action: '+action));
  }
}

/* UI helpers */
function toast(msg, type='info') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[200] px-4 py-2 rounded-xl text-sm font-medium shadow-lg ' +
    (type==='error' ? 'bg-red-600 text-white' : type==='ok' ? 'bg-teal-600 text-white' : 'bg-navy-800 text-sand-100 border border-teal-500/30');
  el.classList.remove('hidden');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.add('hidden'), 3200);
}
function openModal(html) {
  $('#modal-body').innerHTML = html;
  $('#modal').classList.remove('hidden');
  $('#modal').classList.add('flex');
}
function closeModal() {
  $('#modal').classList.add('hidden');
  $('#modal').classList.remove('flex');
}
$('#modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });

function askPasscode() {
  return new Promise(resolve => {
    openModal('<h3 class="font-semibold mb-2"><i class="fa-solid fa-key text-teal-400 mr-2"></i>Admin passcode</h3><p class="text-xs text-sand-200/60 mb-3">Required for admin actions</p><input id="pc-input" type="password" class="w-full rounded-xl px-3 py-2 text-sm mb-3" placeholder="Passcode"/><div class="flex gap-2"><button class="flex-1 rounded-xl py-2 text-sm bg-navy-700" id="pc-cancel">Cancel</button><button class="flex-1 btn-primary rounded-xl py-2 text-sm text-white" id="pc-ok">Confirm</button></div>');
    $('#pc-cancel').onclick = () => { closeModal(); resolve(null); };
    $('#pc-ok').onclick = () => { const v=$('#pc-input').value; closeModal(); resolve(v); };
    setTimeout(()=>{ const i=$('#pc-input'); if(i) i.focus(); }, 50);
  });
}
function roleLabel(r){
  return ({ super_admin:'Super Admin', admin:'Admin', hod:'HOD', kitchen:'Kitchen', boat:'Boat', staff:'Staff' })[r]||r;
}
function canAdmin(){ return ['super_admin','admin','hod'].includes(state.user && state.user.role); }
function canKitchen(){ return ['super_admin','admin','kitchen','hod'].includes(state.user && state.user.role); }
function saveSession(){ localStorage.setItem(SESSION_KEY, JSON.stringify(state.user)); }
function loadSession(){ try { return JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); } catch(e){ return null; } }
function cacheUsers(users){ try { localStorage.setItem(CACHE_USERS_KEY, JSON.stringify({ at:Date.now(), users })); } catch(e){} }
function readUsersCache(){ try { const o = JSON.parse(localStorage.getItem(CACHE_USERS_KEY)||'null'); return (o && o.users) || []; } catch(e){ return []; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function debounce(fn,ms){ let t; return function(){ const a=arguments; clearTimeout(t); t=setTimeout(()=>fn.apply(null,a),ms); }; }
function csvEscape(v){ const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function downloadText(name, text){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'})); a.download=name; a.click();
}

async function refreshUsers(silent){
  state.usersLoading = true;
  state.usersError = null;
  const search = ($('#u-search') && $('#u-search').value) || '';
  const department = ($('#u-dept') && $('#u-dept').value) || '';
  const role = ($('#u-role') && $('#u-role').value) || '';
  try {
    const r = await api('getUsers', { search, department, role, activeOnly: true });
    if (!r || r.success === false) throw new Error((r && r.error) || 'API returned failure');
    const users = r.data && r.data.users;
    if (!Array.isArray(users)) throw new Error('Empty or invalid users payload (non-array). Check SCRIPT_URL.');
    state.usersCache = users;
    cacheUsers(users);
    if (r.data && r.data.version) state.backendVersion = r.data.version;
    const err = $('#u-error'); if (err) { err.classList.add('hidden'); err.innerHTML=''; }
    $('#u-table').innerHTML = renderUsersTable(users);
    $('#u-status').textContent = users.length+' active staff · updated '+formatFiji()+(state.demo?' · demo':'');
    $$('.u-edit').forEach(b => b.onclick = () => openEditUser(b.dataset.email));
  } catch (e) {
    state.usersError = e.message || String(e);
    const err = $('#u-error');
    if (err) {
      err.classList.remove('hidden');
      err.innerHTML = usersErrorUI(state.usersError);
      const tb = $('#u-try-again'); if (tb) tb.onclick = () => refreshUsers(false);
    }
    if (!state.usersCache.length) $('#u-table').innerHTML = '';
    else {
      $('#u-status').textContent = 'Cached data shown · refresh failed';
      $$('.u-edit').forEach(b => b.onclick = () => openEditUser(b.dataset.email));
    }
    if (!silent) toast('Staff refresh failed','error');
  } finally { state.usersLoading = false; }
}

function wireUsersControls(){
  $('#u-refresh').onclick = () => refreshUsers(false);
  $('#u-search').oninput = debounce(() => refreshUsers(true), 300);
  $('#u-dept').onchange = () => refreshUsers(true);
  $('#u-role').onchange = () => refreshUsers(true);
  $('#u-export').onclick = () => {
    const users = state.usersCache;
    const header = 'email,firstName,lastName,department,contact,role,roster,village,active';
    const rows = users.map(u => [u.email,u.firstName,u.lastName,u.department,u.contact,u.role,u.roster,u.village,u.active].map(csvEscape).join(','));
    downloadText('pcr-staff.csv', [header].concat(rows).join('\n'));
  };
  $('#u-add').onclick = () => openAddUser();
  $('#u-import').onclick = () => openImportCsv();
  $('#u-pending').onclick = () => openPending();
  const al = $('#u-alerts'); if (al) al.onclick = () => openAlertEmails();
}

async function openEditUser(email){

  if (state.user.role==='super_admin') roles.push('super_admin');
  let roleOpts = roles.map(r => '<option value="'+r+'" '+(u.role===r?'selected':'')+'>'+roleLabel(r)+'</option>').join('');
  openModal('<h3 class="font-semibold mb-3">Edit user</h3><div class="space-y-2 text-sm"><p class="text-xs text-sand-200/50">'+esc(u.email)+'</p>'+
    '<div class="grid grid-cols-2 gap-2"><input id="eu-fn" class="rounded-xl px-3 py-2" placeholder="First" value="'+esc(u.firstName)+'"/>'+
    '<input id="eu-ln" class="rounded-xl px-3 py-2" placeholder="Last" value="'+esc(u.lastName)+'"/></div>'+
    '<input id="eu-contact" class="w-full rounded-xl px-3 py-2" placeholder="Contact" value="'+esc(u.contact)+'"/>'+
    '<input id="eu-dept" class="w-full rounded-xl px-3 py-2" placeholder="Department" value="'+esc(u.department)+'" '+(isHod?'readonly':'')+'/>'+
    '<select id="eu-role" class="w-full rounded-xl px-3 py-2">'+roleOpts+'</select>'+
    '<input id="eu-roster" class="w-full rounded-xl px-3 py-2" placeholder="Roster" value="'+esc(u.roster)+'"/>'+
    '<input id="eu-village" class="w-full rounded-xl px-3 py-2" placeholder="Village" value="'+esc(u.village)+'"/>'+
    '<label class="flex items-center gap-2 text-xs"><input type="checkbox" id="eu-active" '+(u.active?'checked':'')+'/> Active</label>'+
    '<button id="eu-save" class="btn-primary w-full rounded-xl py-2 text-white">Save changes</button></div>');
  $('#eu-save').onclick = async () => {
    const patch = {
      targetEmail: u.email,
      firstName: $('#eu-fn').value, lastName: $('#eu-ln').value, contact: $('#eu-contact').value,
      department: $('#eu-dept').value, role: $('#eu-role').value, roster: $('#eu-roster').value,
      village: $('#eu-village').value, active: $('#eu-active').checked

    closeModal();

    const res = await api('updateUser', Object.assign({}, patch, { passcode }));

    '<option value="boat">Boat</option><option value="hod">HOD</option><option value="admin">Admin</option>'+
    (state.user.role==='super_admin'?'<option value="super_admin">Super Admin</option>':'')+'</select>'+
    '<label class="flex items-center gap-2 text-xs"><input type="checkbox" id="au-active" checked/> Active (login immediately)</label>'+
    '<button id="au-save" class="btn-primary w-full rounded-xl py-2 text-sm text-white">Create</button></div>');
  $('#au-save').onclick = async () => {
    const payload = {
      email:$('#au-email').value, password:$('#au-pass').value, firstName:$('#au-fn').value,
      lastName:$('#au-ln').value, department:$('#au-dept').value, contact:$('#au-contact').value,
      role:$('#au-role').value, active:$('#au-active').checked
    };
    closeModal();
    const passcode = await askPasscode(); if (!passcode) return;
    const res = await api('addUser', Object.assign({}, payload, { passcode }));
    if (!res.success) toast(res.error,'error'); else { toast('User created','ok'); refreshUsers(false); }
  };
}

function openImportCsv(){
  openModal('<h3 class="font-semibold mb-2">Quick Import CSV</h3>'+
    '<p class="text-[10px] text-sand-200/50 mb-2">Format: email,password,firstName,lastName,department,contact — sets active=true</p>'+
    '<textarea id="csv-text" class="w-full rounded-xl px-3 py-2 text-xs font-mono h-40" placeholder="email,password,firstName,lastName,department,contact"></textarea>'+
    '<button id="csv-go" class="btn-primary w-full rounded-xl py-2 text-sm text-white mt-3">Import</button>');
  $('#csv-go').onclick = async () => {
    const csv = $('#csv-text').value;
    closeModal();
    const passcode = await askPasscode(); if (!passcode) return;
    const res = await api('importUsersCSV',{ csv, passcode });
    if (!res.success) toast(res.error,'error');
    else { toast('Imported '+res.data.imported+', skipped '+((res.data.skipped && res.data.skipped.length)||0),'ok'); refreshUsers(false); }
  };
}

async function openPending(){
  const passcode = await askPasscode(); if (!passcode) return;
  const r = await api('getPendingApprovals',{ passcode });
  const users = (r.data && r.data.users) || [];
  let html = '<h3 class="font-semibold mb-3">Pending @pcr.com approvals</h3><div class="space-y-2">';
  if (!users.length) html += '<p class="text-xs text-sand-200/50">No pending approvals</p>';
  users.forEach(u => {
    html += '<div class="glass rounded-xl p-3 flex justify-between items-center text-sm"><div><p class="font-medium">'+esc(u.firstName)+' '+esc(u.lastName)+'</p>'+
      '<p class="text-[10px] text-sand-200/50">'+esc(u.email)+' · '+esc(u.department)+'</p></div>'+
      '<button class="btn-primary text-xs px-3 py-1 rounded-lg text-white pend-ok" data-email="'+esc(u.email)+'">Approve</button></div>';
  });
  html += '</div>';
  openModal(html);
  $$('.pend-ok').forEach(b=>b.onclick=async()=>{
    const res = await api('approveUser',{ targetEmail:b.dataset.email, passcode });
    if (!res.success) toast(res.error,'error'); else { toast('Approved','ok'); closeModal(); }
  });
}

async function openAlertEmails(){
  const r = await api('getAlertEmails');
  const emails = ((r.data && r.data.emails) || []).map(e=>e.email||e).join('\n');
  openModal('<h3 class="font-semibold mb-2">Alert Emails</h3><p class="text-[10px] text-sand-200/50 mb-2">Super admin only · one email per line</p>'+
    '<textarea id="al-text" class="w-full rounded-xl px-3 py-2 text-xs h-40">'+esc(emails)+'</textarea>'+
    '<button id="al-save" class="btn-primary w-full rounded-xl py-2 text-sm text-white mt-3">Save</button>');
  $('#al-save').onclick = async () => {
    const list = $('#al-text').value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
    closeModal();
    const passcode = await askPasscode(); if (!passcode) return;
    const res = await api('saveAlertEmails',{ emails:list, passcode });
    if (!res.success) toast(res.error,'error'); else toast('Alert emails saved','ok');
  };
}

function renderAdmin(){
  $('#main-content').innerHTML = '<div class="fade-in max-w-lg mx-auto space-y-3">'+
    '<button onclick="openAlertEmails()" class="glass w-full rounded-xl px-4 py-3 text-left text-sm"><i class="fa-solid fa-envelope text-teal-400 mr-2"></i>Manage Alert Emails</button>'+
    '<button onclick="navigate(\'users\')" class="glass w-full rounded-xl px-4 py-3 text-left text-sm"><i class="fa-solid fa-users text-teal-400 mr-2"></i>Staff Directory</button>'+
    '<button onclick="checkHealth()" class="glass w-full rounded-xl px-4 py-3 text-left text-sm"><i class="fa-solid fa-heart-pulse text-teal-400 mr-2"></i>API health / version</button></div>';
}

function maybeProfileModal(){
  if (!state.user || !state.user.needsProfile) return;
  openModal('<h3 class="font-semibold mb-1">Complete Your Profile</h3>'+
    '<p class="text-xs text-sand-200/60 mb-3">First name, last name and department are required.</p><div class="space-y-2">'+
    '<input id="pf-fn" class="w-full rounded-xl px-3 py-2 text-sm" placeholder="First name" value="'+esc(state.user.firstName)+'"/>'+
    '<input id="pf-ln" class="w-full rounded-xl px-3 py-2 text-sm" placeholder="Last name" value="'+esc(state.user.lastName)+'"/>'+
    '<input id="pf-dept" class="w-full rounded-xl px-3 py-2 text-sm" placeholder="Department" value="'+esc(state.user.department)+'"/>'+
    '<input id="pf-contact" class="w-full rounded-xl px-3 py-2 text-sm" placeholder="Contact" value="'+esc(state.user.contact)+'"/>'+
    '<button id="pf-save" class="btn-primary w-full rounded-xl py-2 text-sm text-white">Save profile</button></div>');
  $('#pf-save').onclick = async () => {
    const firstName=$('#pf-fn').value.trim(), lastName=$('#pf-ln').value.trim(), department=$('#pf-dept').value.trim();
    if (!firstName||!lastName||!department) { toast('All three required','error'); return; }
    const res = await api('updateProfile',{ targetEmail:state.user.email, email:state.user.email, firstName, lastName, department, contact:$('#pf-contact').value });
    if (!res.success) { toast(res.error,'error'); return; }
    state.user = res.data.user; saveSession(); closeModal(); toast('Profile saved','ok'); navigate('home');
  };
}

let pendingVerifyEmail = '';
async function doLogin(email, password){
  $('#login-error').classList.add('hidden');
  const r = await api('login',{ email, password });
  if (r.needsVerification) {
    pendingVerifyEmail = r.email || email;
    $('#verify-panel').classList.remove('hidden');
    toast('Verification required','info');
    const vr = await api('requestVerification',{ email: pendingVerifyEmail });
    if (vr.data && vr.data.code) toast('Demo code: '+vr.data.code,'info');
    return;
  }
  if (!r.success) {
    $('#login-error').textContent = r.error || 'Login failed';
    $('#login-error').classList.remove('hidden');
    return;
  }
  state.user = r.data.user;
  saveSession();
  enterApp();
}
function enterApp(){
  $('#view-login').classList.add('hidden');
  $('#view-main').classList.remove('hidden');
  navigate('home');
  maybeProfileModal();
  api('getVersion').then(r=>{ state.backendVersion = r.version || (r.data && r.data.version); }).catch(()=>{});
}

$('#login-form').onsubmit = async (e) => {
  e.preventDefault();
  await doLogin($('#login-email').value.trim(), $('#login-password').value);
};
$('#btn-verify').onclick = async () => {
  const r = await api('verifyEmail',{ email: pendingVerifyEmail, code: $('#verify-code').value.trim() });
  if (!r.success) { toast(r.error,'error'); return; }
  toast('Verified — sign in again','ok');
  $('#verify-panel').classList.add('hidden');
};
$('#btn-resend-code').onclick = async () => {
  const vr = await api('requestVerification',{ email: pendingVerifyEmail });
  if (vr.data && vr.data.code) toast('Code: '+vr.data.code,'info'); else toast('Code sent','ok');
};
$('#btn-logout').onclick = () => {
  state.user = null; localStorage.removeItem(SESSION_KEY);
  $('#view-main').classList.add('hidden');
  $('#view-login').classList.remove('hidden');
};

function boot(){
  $('#ui-version').textContent = APP_VERSION;
  state.demo = isDemoMode();
  if (state.demo) {
    $('#demo-badge').classList.remove('hidden');
    loadDemo();
  }
  const tick = () => { const el=$('#fiji-clock'); if(el) el.textContent = formatFiji(); };
  tick(); setInterval(tick, 30000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  const session = loadSession();
  if (session && session.email) {
    state.user = session;
    state.user.needsProfile = !(session.firstName && session.lastName && session.department);
    enterApp();
  }
}
boot();
</script>
</body>
</html>
